name: Build APK (Web -> Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project zip (if present)
        run: |
          if [ -f pgp-quiz-web-apk.zip ]; then
            unzip -o pgp-quiz-web-apk.zip -d .
            rm pgp-quiz-web-apk.zip
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor project
        run: npx cap init "PGP Quiz" "com.infas.pgpquiz" --web-dir=dist

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
